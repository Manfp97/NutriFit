# Nombre de la aplicación
spring.application.name=NutriFit

# Configuración de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuración de la fuente de datos
# Estas propiedades serán sobreescritas por Testcontainers durante las pruebas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3309/nutrifit
spring.datasource.username=root
spring.datasource.password=password

# Configuración de JPA e Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Configuración del puerto del servidor
server.port=8091

# Configuración de sesiones
spring.session.store-type=redis

# Configuración de logging
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging.simp=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# Configuración del path de errores
server.error.path=/error

