<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
  <title>Chat Notifications</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="/js/chat.js"></script>
</head>
<body>
<div class="container" layout:fragment="content">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
      <tr>
        <th>From</th>
        <th>Mensaje</th>
      </tr>
      </thead>
      <tbody >
      <tr th:each="notificacion : ${notificaciones}">
        <td th:text="${notificacion.from}"></td>
        <td th:text="${notificacion.message}"></td>
        <!-- Add other fields -->
      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
