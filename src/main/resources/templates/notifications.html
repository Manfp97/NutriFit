<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
  <title>Chat Notifications</title>
  <style>
    /* Asegura que la página ocupe toda la altura de la ventana */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Hace que el body use flexbox para el layout */
    body {
      display: flex;
      flex-direction: column;
    }

    /* Contenedor principal que crece para llenar el espacio disponible */
    .main-container {
      flex: 1;
      padding: 20px;
    }

    /* Ajustes para pantallas anchas */
    @media (min-width: 1000px) {
      .main-container {
        padding: 40px;
      }
    }

    /* Footer siempre en la parte inferior */
    footer {
      background-color: #f8f9fa;
      text-align: center;
      padding: 10px 0;
      border-top: 1px solid #e7e7e7;
      font-size: 0.9em;
      color: #6c757d;
    }
  </style>
</head>
<body>
<!-- Contenedor principal -->
<div class="container main-container" layout:fragment="content">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
      <tr>
        <th>De</th>
        <th>Mensaje</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="notificacion : ${notificaciones}">
        <td th:text="${notificacion.from}"></td>
        <td th:text="${notificacion.message}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Footer -->
<footer class="mt-auto">
  © 2024 Chat Notifications - Todos los derechos reservados
</footer>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
