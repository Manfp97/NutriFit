<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org/" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${dieta.nombre}">Detalle de la Dieta</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <h1 th:text="${dieta.nombre}" class="display-4 mb-4"></h1>
                <p th:text="${dieta.descripcion}" class="lead mb-4"></p>
                <div class="card mb-4">
                    <div class="card-body">
                        <h4 class="card-title">Detalles</h4>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>Objetivos: </strong><span th:text="${dieta.objetivos}"></span></li>
                            <li class="list-group-item"><strong>Categoría: </strong><span th:text="${dieta.categoria}"></span></li>
                            <li class="list-group-item"><strong>Planificación y Frecuencia: </strong><span th:text="${dieta.planificacion_frecuencia}"></span></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Recursos Multimedia</h4>
                        <img th:src="@{/img/comida2.jpg}" class="img-fluid rounded" alt="Imagen de dieta">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
