    <link th:href="@{/css/style.css}" rel="stylesheet">

    <!-- JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<body>
<!-- Header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Toast for notifications -->
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong id="toast-title" class="me-auto"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div id="toast-body" class="toast-body"></div>
    </div>
</div>

<!-- Main content -->
<main layout:fragment="content">
    <!-- This is where your page-specific content will go -->
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Notification script -->
<script th:inline="javascript">
    // Global variables
    var stompClient = null;
    var notificationCount = 0;

    // Initialize when the document is ready
    $(document).ready(function() {
        connect();
        actualizarNotificaciones();
    });

    function connect() {
        var socket = new SockJS('http://localhost:8091/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);
            subscribeToTopics();
        }, function(error) {
            console.log('STOMP error ' + error);
            setTimeout(connect, 5000); // Try to reconnect after 5 seconds
        });
    }

    function subscribeToTopics() {
        // Subscribe to private messages for toast notifications
        stompClient.subscribe('/user/topic/private-messages', function(messageOutput) {
            var message = JSON.parse(messageOutput.body);
            mostrarToast(message);
        });

        // Subscribe to global notifications
        stompClient.subscribe('/topic/global-notifications', function(messageOutput) {
            notificationCount++;
            actualizarNotificaciones();
        });

        // Subscribe to private notifications
        stompClient.subscribe('/user/topic/private-notifications', function(message) {
            notificationCount++;
            actualizarNotificaciones();
        });
    }

    function mostrarToast(messageOutput) {
        $("#toast-title").html(messageOutput.from);
        $("#toast-body").html(messageOutput.text);
        var toast = new bootstrap.Toast(document.getElementById('toast'));
        toast.show();
    }

    function actualizarNotificaciones() {
        $.get("/notificaciones/contar", function(data) {
            $("#countNotificaciones").html(data);
        });
    }

    // Function to send a notification (can be called from your HTML or other parts of your JS)
    function enviarNotificacion(to, message) {
        $.post("/notificaciones/crear", { to: to, message: message });
    }
</script>
</body>
</html>
