<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Proveedores</title>
</head>
<body>
<div layout:fragment="content" class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-5">
                    <h1 class="card-title mb-4 text-center fw-bold">Crear Proveedores</h1>
                    <form th:action="@{/proveedores/nuevo}" th:object="${proveedores}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre del proveedores" />
                            <label for="nombre">Nombre:</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea type="text" id="direccion" rows="5" th:field="*{direccion}" class="form-control" placeholder="Direccion del proveedores">
                            </textarea>
                            <label for="direccion">Direccion:</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="contacto" th:field="*{contacto}" class="form-control" placeholder="contacto del proveedores" />
                            <label for="contacto">Contacto:</label>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary rounded-3 px-5 py-2">Crear Proveedores</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
