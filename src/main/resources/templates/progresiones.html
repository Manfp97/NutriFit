<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFit - Seguimiento de Progresiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #45a049;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            max-width: 1200px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: var(--primary-color);
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
        .table th {
            font-weight: 600;
        }
        .progress {
            height: 10px;
        }
        #progressChart {
            max-height: 300px;
        }
        .btn-volver {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card mb-4">
        <div class="card-header">
            <h2 class="mb-0"><i class="fas fa-dumbbell me-2"></i>NutriFit - Seguimiento de Progresiones</h2>
        </div>
        <div class="card-body">
            <div class="mb-4">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProgressionModal">
                    <i class="fas fa-plus me-2"></i>Añadir Progresión
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Ejercicio</th>
                        <th>Repeticiones</th>
                        <th>Series</th>
                        <th>Peso (kg)</th>
                        <th>Progreso</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="progressionTableBody">
                    <tr th:each="progresion : ${progresiones}">
                        <td th:text="${progresion.fecha}"></td>
                        <td th:text="${progresion.ejercicio}"></td>
                        <td th:text="${progresion.peso}"></td>
                        <td th:text="${progresion.repeticiones}"></td>
                        <td th:text="${progresion.series}"></td>
                        <!-- Add other fields -->
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h3 class="mb-0">Gráfico de Progreso</h3>
        </div>
        <div class="card-body">
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <a class="btn btn-primary btn-lg btn-volver" th:href="@{/usuario/perfil}">
        <i class="fas fa-arrow-left me-2"></i>Volver
    </a>
</div>

<!-- Modal para añadir/editar progresión -->
<div class="modal fade" id="addProgressionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Añadir Progresión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="progressionForm" action="/progresionesEntrenamientos/guardar" method="post">
                    <input type="hidden" name="id" id="progressionId">
                    <div class="mb-3">
                        <label for="date" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="date" name="fecha" required>
                    </div>
                    <div class="mb-3">
                        <label for="exercise" class="form-label">Ejercicio</label>
                        <input type="text" class="form-control" id="exercise" name="ejercicio" required>
                    </div>
                    <div class="mb-3">
                        <label for="repetitions" class="form-label">Repeticiones</label>
                        <input type="number" class="form-control" id="repetitions" name="repeticiones" required>
                    </div>
                    <div class="mb-3">
                        <label for="sets" class="form-label">Series</label>
                        <input type="number" class="form-control" id="sets" name="series" required>
                    </div>
                    <div class="mb-3">
                        <label for="weight" class="form-label">Peso (kg)</label>
                        <input type="number" class="form-control" id="weight" name="peso" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="progressionForm" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let chart;
    let progresiones = [];

    function inicializarGrafico() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Peso Levantado (kg)',
                    data: [],
                    borderColor: '#4CAF50',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    function actualizarGrafico() {
        const ejercicio = progresiones[0]?.ejercicio || '';
        chart.data.labels = progresiones.map(p => p.fecha);
        chart.data.datasets[0].data = progresiones.map(p => p.peso);
        chart.data.datasets[0].label = `Peso Levantado (kg) - ${ejercicio}`;
        chart.update();
    }

    function cargarProgresiones() {
        fetch('/progresionesEntrenamientos/listar')
            .then(response => response.json())
            .then(data => {
                progresiones = data;
                actualizarTablaProgresiones();
                actualizarGrafico();
            })
            .catch(error => console.error('Error al cargar progresiones:', error));
    }

    function actualizarTablaProgresiones() {
        const tbody = document.getElementById('progressionTableBody');
        tbody.innerHTML = '';
        progresiones.forEach((progresion, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${progresion.fecha}</td>
                <td>${progresion.ejercicio}</td>
                <td>${progresion.repeticiones}</td>
                <td>${progresion.series}</td>
                <td>${progresion.peso}</td>
                <td>
                    <div class="progress">
                        <div class="progress-bar bg-success" role="progressbar" style="width: ${(index + 1) * 10}%"></div>
                    </div>
                </td>
                <td>
                    <a href="/progresionesEntrenamientos/eliminar/${progresion.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Estás seguro de que quieres eliminar esta progresión?')">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        inicializarGrafico();
        cargarProgresiones();
    });
</script>
</body>
</html>
