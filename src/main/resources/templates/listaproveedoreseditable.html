<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proveedores</title>
    <!-- Incluye tu CSS aquí -->
</head>
<body>
<div layout:fragment="content" class="mt-4">
    <div class="container-xxl py-6 wow fadeInUp" data-wow-delay="0.1s">
        <h1 class="text-center mb-4">Lista de Proveedores</h1>
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Contacto</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="proveedores : ${proveedoresPage.content}">
                    <td th:text="${proveedores.id}">1</td>
                    <td th:text="${proveedores.nombre}">Nombre del Proveedor</td>
                    <td th:text="${proveedores.contacto}">Contacto</td>
                    <td>
                        <!-- Enlace para editar el proveedores -->
                        <a th:href="@{/proveedores/{id}(id=${proveedores.id})}" class="btn btn-primary">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- Paginación -->
        <div class="d-flex justify-content-center mt-4">
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <li th:classappend="${proveedoresPage.hasPrevious()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/proveedores/list(page=${proveedoresPage.number - 1}, size=${proveedoresPage.size})}" class="page-link">Anterior</a>
                    </li>
                    <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == proveedoresPage.number} ? 'active' : ''">
                        <a th:href="@{/proveedores/list(page=${pageNumber - 1}, size=${proveedoresPage.size})}" class="page-link" th:text="${pageNumber}">1</a>
                    </li>
                    <li th:classappend="${proveedoresPage.hasNext()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/proveedores/list(page=${proveedoresPage.number + 1}, size=${proveedoresPage.size})}" class="page-link">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
