<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="message-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
</div>

<script th:inline="javascript">
    const roomId = /*[[${roomId}]]*/ 'defaultRoomId'; // Asegúrate de que `roomId` se reemplaza correctamente
    const currentUserId = /*[[${currentUserId}]]*/ 'defaultUserId'; // Asegúrate de que `currentUserId` se reemplaza correctamente
    const recipientId = /*[[${recipientId}]]*/ 'defaultRecipientId'; // Asegúrate de que `recipientId` se reemplaza correctamente
</script>
<script src="/js/chat.js"></script>
</body>
</html>
