<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi Contraseña - NUTRIFIT</title>
    <style>
        body {
            background-color: #f8f9fa;
            background-image: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.8);
        }
        .card-header {
            background-color: #4CAF50;
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background-color: #4CAF50;
            border-color: #4CAF50;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #45a049;
            border-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #ddd;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }
        .card-body {
            padding: 40px;
        }
        .text-nutrifit {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header text-center py-4">
                    <h2 class="mb-0">Olvidé mi Contraseña</h2>
                    <p class="mt-2 mb-0 text-white">Recupera tu acceso a <span class="fw-bold">NUTRIFIT</span></p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/auth/forgot-password}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label text-nutrifit">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="tucorreo@ejemplo.com">
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane me-2"></i>Enviar Enlace de Restablecimiento
                            </button>
                        </div>
                    </form>
                    <div class="mt-4 text-center">
                        <p th:if="${message}" th:text="${message}" class="text-success"></p>
                        <p th:if="${error}" th:text="${error}" class="text-danger"></p>
                        <p class="mb-0 mt-3">¿Recordaste tu contraseña? <a th:href="@{/login}" class="text-nutrifit">Iniciar Sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
