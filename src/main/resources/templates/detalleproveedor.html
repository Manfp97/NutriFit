<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Proveedor</title>
    <!-- Incluye tu CSS aquí -->
</head>
<body>
<div layout:fragment="content" class="mt-4">
    <div class="container-xxl py-6 wow fadeInUp" data-wow-delay="0.1s">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-5">
                        <h1 class="card-title mb-4 text-center fw-bold">Actualizar Proveedor</h1>
                        <!-- Formulario para actualizar el proveedor -->
                        <form th:action="@{/proveedores/{id}(id=${proveedores.id})}" th:object="${proveedores}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <div class="form-floating mb-3">
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre del proveedor" />
                                <label for="nombre">Nombre:</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" id="contacto" th:field="*{contacto}" class="form-control" placeholder="Contacto del proveedor" />
                                <label for="contacto">Contacto:</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" id="direccion" th:field="*{direccion}" class="form-control" placeholder="Dirección del proveedor" />
                                <label for="direccion">Dirección: :</label>
                            </div>
                            <div class="text-center mb-3">
                                <button type="submit" class="btn btn-primary rounded-3 px-5 py-2">Actualizar Proveedor</button>
                            </div>
                        </form>


                        <!-- Formulario para eliminar el proveedor -->
                        <form th:action="@{/proveedores/delete/{id}(id=${proveedores.id})}" method="post" onsubmit="return confirm('¿Estás seguro de que deseas eliminar este proveedor?');">
                            <input type="hidden" name="_method" value="delete" />
                            <div class="text-center">
                                <button type="submit" class="btn btn-danger rounded-3 px-5 py-2">Eliminar Proveedor</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
