<section id="dieta" class="dieta-section container-xxl py-5" th:fragment="dietalista">
    <div class="container">
        <div class="row g-0 gx-5 align-items-end">
            <div class="col-lg-6">
                <div class="dieta-section-header text-start mb-5 wow fadeInUp" data-wow-delay="0.1s">
                    <h1 class="dieta-title display-5 mb-3">Dietas</h1>
                    <p class="dieta-subtitle">Tu dieta es una cuenta bancaria. Las buenas elecciones alimentarias son buenas inversiones.</p>
                </div>
            </div>

            <div class="col-lg-6 text-start text-lg-end wow slideInRight" data-wow-delay="0.1s">
                <ul class="dieta-admin-buttons nav nav-pills d-inline-flex justify-content-end mb-5">
                    <li class="nav-item me-2">
                        <a class="btn btn-primary dieta-admin-btn" th:href="@{/dietaUsuario/list}"
                           th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}"
                           th:text="'Lista de productos'"></a>
                    </li>
                    <li class="nav-item me-2">
                        <a class="btn btn-success dieta-admin-btn" th:href="@{/dietaUsuario/nuevo}"
                           th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}"
                           th:text="'Nuevo producto'"></a>
                    </li>
                </ul>
            </div>

            <div class="col-lg-12 text-center wow slideInRight" data-wow-delay="0.1s">
                <ul class="dieta-category-buttons nav nav-pills d-inline-flex justify-content-center mb-5 flex-wrap">
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2 dieta-category-btn" th:href="@{/dietaUsuario(categoria='aumentodemasamuscular', size=${pagina.size}, page=0)}" th:text="'Aumento de Masa Muscular'" th:classappend="${categoria == 'aumentodemasamuscular'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2 dieta-category-btn" th:href="@{/dietaUsuario(categoria='perdidadepeso', size=${pagina.size}, page=0)}" th:text="'Pérdida de Peso'" th:classappend="${categoria == 'perdidadepeso'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2 dieta-category-btn" th:href="@{/dietaUsuario(categoria='aumentodepeso', size=${pagina.size}, page=0)}" th:text="'Aumento de Peso'" th:classappend="${categoria == 'aumentodepeso'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2 dieta-category-btn" th:href="@{/dietaUsuario(categoria='dietadeportiva', size=${pagina.size}, page=0)}" th:text="'Dieta Deportiva'" th:classappend="${categoria == 'dietadeportiva'} ? 'active'"></a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="tab-content">
            <!-- Sección Aumento de Masa Muscular -->
            <div class="tab-pane fade show" th:classappend="${categoria == 'aumentodemasamuscular'} ? 'active'" id="aumentodemasamuscular">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="dieta, iterStat : ${dietas}">
                        <div class="card">
                            <img th:src="@{'/img/comida' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225">
                            <div class="card-body">
                                <h5 th:text="${dieta.nombre}" class="card-title"></h5>
                                <p th:text="${dieta.descripcion}" class="card-text"></p>
                                <a href="#" class="btn btn-primary rounded-pill">Ver más</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='aumentodemasamuscular', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/dietaUsuario(categoria='aumentodemasamuscular', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='aumentodemasamuscular', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Pérdida de Peso -->
            <div class="tab-pane fade" th:classappend="${categoria == 'perdidadepeso'} ? 'active show' : ''" id="perdidadepeso">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="dieta, iterStat : ${dietas}">
                        <div class="card">
                            <img th:src="@{'/img/comida' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225">
                            <div class="card-body">
                                <h5 th:text="${dieta.nombre}" class="card-title"></h5>
                                <p th:text="${dieta.descripcion}" class="card-text"></p>
                                <a href="#" class="btn btn-primary rounded-pill">Ver más</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='perdidadepeso', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/dietaUsuario(categoria='perdidadepeso', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='perdidadepeso', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Aumento de Peso -->
            <div class="tab-pane fade" th:classappend="${categoria == 'aumentodepeso'} ? 'active show' : ''" id="aumentodepeso">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="dieta, iterStat : ${dietas}">
                        <div class="card">
                            <img th:src="@{'/img/comida' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225">
                            <div class="card-body">
                                <h5 th:text="${dieta.nombre}" class="card-title"></h5>
                                <p th:text="${dieta.descripcion}" class="card-text"></p>
                                <a href="#" class="btn btn-primary rounded-pill">Ver más</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='aumentodepeso', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/dietaUsuario(categoria='aumentodepeso', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='aumentodepeso', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Dieta Deportiva -->
            <div class="tab-pane fade" th:classappend="${categoria == 'dietadeportiva'} ? 'active show' : ''" id="dietadeportiva">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="dieta, iterStat : ${dietas}">
                        <div class="card">
                            <img th:src="@{'/img/comida' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225" >
                            <div class="card-body">
                                <h5 th:text="${dieta.nombre}" class="card-title"></h5>
                                <p th:text="${dieta.descripcion}" class="card-text"></p>
                                <a href="#" class="btn btn-primary rounded-pill">Ver más</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='dietadeportiva', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/dietaUsuario(categoria='dietadeportiva', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/dietaUsuario(categoria='dietadeportiva', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
