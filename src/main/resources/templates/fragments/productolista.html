<section id="producto" class="producto-lista-section" th:fragment="productolista">
    <div class="container">
        <div class="row g-0 gx-5 align-items-end mb-5">
            <div class="col-lg-6">
                <div class="producto-lista-header producto-lista-fadeInUp" data-wow-delay="0.1s">
                    <h1>Nuestros Productos</h1>
                    <p>No se trata de ser el mejor, se trata de ser mejor que ayer. Cada esfuerzo cuenta, cada repetición suma.</p>
                </div>
            </div>

            <!-- Botones administrativos -->
            <div class="col-lg-6 text-lg-end mt-4 mt-lg-0 producto-lista-admin-buttons producto-lista-fadeInUp" data-wow-delay="0.2s">
                <div th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}">
                    <a class="btn btn-primary me-2 mb-2" th:href="@{/producto/list}">Lista de productos</a>
                    <a class="btn btn-success mb-2" th:href="@{/producto/nuevo}">Nuevo producto</a>
                </div>
            </div>
        </div>

        <!-- Filtros de categoría -->
        <div class="row mb-5">
            <div class="col-12 producto-lista-categorias producto-lista-fadeInUp" data-wow-delay="0.3s">
                <ul class="nav nav-pills justify-content-center">
                    <li class="nav-item mx-1 mb-2">
                        <a class="btn btn-outline-primary" th:href="@{/producto(categoria='proteina', size=${pagina.size}, page=0)}" th:classappend="${categoria == 'proteina'} ? 'active'">Proteína</a>
                    </li>
                    <li class="nav-item mx-1 mb-2">
                        <a class="btn btn-outline-primary" th:href="@{/producto(categoria='creatina', size=${pagina.size}, page=0)}" th:classappend="${categoria == 'creatina'} ? 'active'">Creatina</a>
                    </li>
                    <li class="nav-item mx-1 mb-2">
                        <a class="btn btn-outline-primary" th:href="@{/producto(categoria='snacks', size=${pagina.size}, page=0)}" th:classappend="${categoria == 'snacks'} ? 'active'">Snacks</a>
                    </li>
                    <li class="nav-item mx-1 mb-2">
                        <a class="btn btn-outline-primary" th:href="@{/producto(categoria='vitaminas', size=${pagina.size}, page=0)}" th:classappend="${categoria == 'vitaminas'} ? 'active'">Vitaminas</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Lista de productos -->
        <div class="row g-4">
            <div class="col-md-6 col-lg-4 col-xl-3" th:each="producto : ${productos}">
                <div class="producto-lista-card producto-lista-fadeInUp" data-wow-delay="0.1s">
                    <img th:src="@{img/Creatina-Creapure-Justloading-2.jpg}" class="producto-lista-card-img" alt="Imagen del producto">
                    <div class="producto-lista-card-body">
                        <h5 class="producto-lista-card-title" th:text="${producto.nombre}"></h5>
                        <p class="producto-lista-card-text" th:text="${#strings.abbreviate(producto.descripcion, 100)}"></p>
                        <p class="producto-lista-card-price" th:text="${#numbers.formatDecimal(producto.precio, 0, 'POINT', 2, 'COMMA') + ' €'}"></p>
                        <div class="producto-lista-card-buttons">
                            <a class="btn btn-primary w-100 mb-2">Ver más</a>
                            <form th:action="@{/carrito/agregar/{idProducto}(idProducto=${producto.id})}" method="post" class="agregar-al-carrito-form">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-outline-primary w-100">Añadir al carrito</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Paginación -->
        <nav th:if="${pagina.totalPages > 0}" class="producto-lista-pagination producto-lista-fadeInUp" data-wow-delay="0.2s">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!pagina.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/producto(categoria=${categoria}, size=${pagina.size}, page=${pagina.number - 1})}" aria-label="Anterior">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="pageNumber : ${pageNumbers}" th:classappend="${pageNumber - 1 == pagina.number} ? 'active'">
                    <a class="page-link" th:href="@{/producto(categoria=${categoria}, size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}"></a>
                </li>
                <li class="page-item" th:classappend="${!pagina.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/producto(categoria=${categoria}, size=${pagina.size}, page=${pagina.number + 1})}" aria-label="Siguiente">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>


    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var csrfToken = /*[[${_csrf != null} ? ${_csrf.token} : null]]*/ null;
            var csrfHeader = /*[[${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN']]*/ 'X-CSRF-TOKEN';

            function showNotification(message, isSuccess) {
                Toastify({
                    text: message,
                    duration: 3000,
                    close: true,
                    gravity: "top", // `top` or `bottom`
                    position: "right", // `left`, `center` or `right`
                    backgroundColor: isSuccess ? "#4CAF50" : "#F44336",
                    stopOnFocus: true
                }).showToast();
            }

            document.querySelectorAll('.agregar-al-carrito-form').forEach(function(form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    var formData = new FormData(this);

                    var headers = new Headers();
                    if (csrfToken) {
                        headers.append(csrfHeader, csrfToken);
                    }

                    fetch(this.action, {
                        method: 'POST',
                        body: formData,
                        headers: headers
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('HTTP error ' + response.status);
                            }
                            const contentType = response.headers.get("content-type");
                            if (contentType && contentType.indexOf("application/json") !== -1) {
                                return response.json();
                            } else {
                                return response.text();
                            }
                        })
                        .then(data => {
                            console.log('Respuesta del servidor:', data);
                            if (typeof data === 'object' && data.success) {
                                showNotification('Producto añadido al carrito exitosamente', true);
                            } else {
                                showNotification('Producto añadido al carrito', true);
                            }
                            // Aquí puedes actualizar la UI, por ejemplo, un contador de items en el carrito
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            showNotification('Error al añadir el producto al carrito: ' + error.message, false);
                        });
                });
            });
        });
        /*]]>*/
    </script>
</section>
