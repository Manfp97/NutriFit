<section id="entrenamiento" class="entrenamiento-section container-xxl py-5" th:fragment="entrenamientolista">
    <div class="container">
        <div class="row g-0 gx-5 align-items-end">
            <div class="col-lg-6">
                <div class="entrenamiento-section-header text-start mb-5 wow fadeInUp" data-wow-delay="0.1s">
                    <h1 class="entrenamiento-title display-5 mb-3">Entrenamiento</h1>
                    <p class="entrenamiento-subtitle">No se trata de ser el mejor, se trata de ser mejor que ayer. Cada esfuerzo cuenta, cada repetición suma.</p>
                </div>
            </div>


            <div class="col-lg-6 text-start text-lg-end wow slideInRight" data-wow-delay="0.1s">
                <ul class="nav nav-pills d-inline-flex justify-content-end mb-5 flex-wrap">

                    <!-- Botones de administración solo para usuarios con roles específicos -->
                    <li class="nav-item me-2 mb-2" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}">
                        <a class="btn btn-primary" th:href="@{/entrenamiento/list}" th:text="'Lista de entrenamientos'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}">
                        <a class="btn btn-success" th:href="@{/entrenamiento/nuevo}" th:text="'Nuevo Entrenamiento'"></a>
                    </li>

                    <!-- Espacio entre botones de administración y categorías -->
                    <li class="nav-item me-2 mb-2" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'') or hasRole(''ROLE_EMPLEADO'')')}">
                        <span class="d-inline-block" style="width: 20px;"></span>
                    </li>

                    <!-- Botones de categoría para todos los usuarios -->
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2" th:href="@{/entrenamiento(categoria='musculacion', size=${pagina.size}, page=0)}" th:text="'Musculación'" th:classappend="${categoria == 'musculacion'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2" th:href="@{/entrenamiento(categoria='mantenimiento', size=${pagina.size}, page=0)}" th:text="'Mantenimiento'" th:classappend="${categoria == 'mantenimiento'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2" th:href="@{/entrenamiento(categoria='pesocorporal', size=${pagina.size}, page=0)}" th:text="'Peso Corporal'" th:classappend="${categoria == 'pesocorporal'} ? 'active'"></a>
                    </li>
                    <li class="nav-item me-2 mb-2">
                        <a class="btn btn-outline-primary border-2" th:href="@{/entrenamiento(categoria='cardio', size=${pagina.size}, page=0)}" th:text="'Cardio'" th:classappend="${categoria == 'cardio'} ? 'active'"></a>
                    </li>

                </ul>
            </div>

        </div>
        <div class="tab-content">
            <!-- Sección Musculacion -->
            <div class="tab-pane fade" th:classappend="${categoria == 'musculacion'} ? 'show active' : ''" id="musculacion">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="entrenamiento, iterStat : ${entrenamientos}">
                        <div class="card">
                            <img th:src="@{'/img/entrenamiento' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225" th:alt="${entrenamiento.nombre}">
                            <div class="card-body">
                                <h5 th:text="${entrenamiento.nombre}" class="card-title"></h5>
                                <p th:text="${entrenamiento.objetivos}" class="card-text"></p>
                                <a th:href="@{/entrenamiento/vermas/{id}(id=${entrenamiento.id})}" class="btn btn-primary rounded-pill">Ver más</a>


                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='musculacion', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/entrenamiento(categoria='musculacion', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='musculacion', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Mantenimiento -->
            <div class="tab-pane fade" th:classappend="${categoria == 'mantenimiento'} ? 'show active' : ''" id="mantenimiento">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="entrenamiento, iterStat : ${entrenamientos}">
                        <div class="card">

                            <div class="card-body">
                                <h5 th:text="${entrenamiento.nombre}" class="card-title"></h5>
                                <p th:text="${entrenamiento.objetivos}" class="card-text"></p>
                                <a th:href="@{/entrenamiento/vermas/{id}(id=${entrenamiento.id})}" class="btn btn-primary rounded-pill">Ver más</a>


                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='mantenimiento', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/entrenamiento(categoria='mantenimiento', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='mantenimiento', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Peso Corporal -->
            <div class="tab-pane fade" th:classappend="${categoria == 'pesocorporal'} ? 'show active' : ''" id="pesocorporal">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="entrenamiento, iterStat : ${entrenamientos}">
                        <div class="card">
                            <img th:src="@{'/img/entrenamiento' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225" th:alt="${entrenamiento.nombre}">
                            <div class="card-body">
                                <h5 th:text="${entrenamiento.nombre}" class="card-title"></h5>
                                <p th:text="${entrenamiento.objetivos}" class="card-text"></p>
                                <a th:href="@{/entrenamiento/vermas/{id}(id=${entrenamiento.id})}" class="btn btn-primary rounded-pill">Ver más</a>


                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='pesocorporal', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/entrenamiento(categoria='pesocorporal', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='pesocorporal', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Sección Cardio -->
            <div class="tab-pane fade" th:classappend="${categoria == 'cardio'} ? 'show active' : ''" id="cardio">
                <div class="row g-5">
                    <div class="col-lg-4" th:each="entrenamiento, iterStat : ${entrenamientos}">
                        <div class="card">
                            <img th:src="@{'/img/entrenamiento' + ${iterStat.count % 4 + 1} + '.jpg'}" class="card-img-top img-fluid max-height-225" th:alt="${entrenamiento.nombre}">
                            <div class="card-body">
                                <h5 th:text="${entrenamiento.nombre}" class="card-title"></h5>
                                <p th:text="${entrenamiento.objetivos}" class="card-text"></p>
                                <a th:href="@{/entrenamiento/vermas/{id}(id=${entrenamiento.id})}" class="btn btn-primary rounded-pill">Ver más</a>


                            </div>
                        </div>
                    </div>
                </div>
                <!-- Paginación -->
                <div th:if="${pagina.totalPages > 0}" class="pagination-container mt-4">
                    <ul class="pagination justify-content-center">
                        <li th:if="${pagina.hasPrevious()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='cardio', size=${pagina.size}, page=${pagina.number - 1})}" class="page-link" aria-label="Anterior">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber - 1 == pagina.number} ? 'active' : ''">
                            <a th:href="@{/entrenamiento(categoria='cardio', size=${pagina.size}, page=${pageNumber - 1})}" th:text="${pageNumber}" class="page-link"></a>
                        </li>
                        <li th:if="${pagina.hasNext()}" class="page-item">
                            <a th:href="@{/entrenamiento(categoria='cardio', size=${pagina.size}, page=${pagina.number + 1})}" class="page-link" aria-label="Siguiente">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
