<!-- Trabaja con Nosotros -->
<section class="trabaja-con-nosotros bg-white py-6" th:fragment="testimonios">
    <div class="container">
        <div class="row g-5 align-items-center">
            <div class="col-lg-6 wow fadeInLeft" data-wow-delay="0.2s">
                <h2 class="display-4 text-primary fw-bold mb-4">Únete a Nuestro Equipo</h2>
                <p class="lead text-primary mb-4">En NutriFit, buscamos profesionales apasionados por la nutrición y el fitness. Sé parte de una empresa innovadora y ayuda a transformar vidas.</p>
                <div class="d-flex align-items-center mb-4">
                    <div class="d-flex align-items-center justify-content-center bg-primary rounded-circle" style="width: 50px; height: 50px;">
                        <i class="fas fa-chart-line text-white"></i>
                    </div>
                    <div class="ms-3">
                        <h5 class="text-primary mb-0">Crecimiento profesional</h5>
                    </div>
                </div>
                <div class="d-flex align-items-center mb-4">
                    <div class="d-flex align-items-center justify-content-center bg-primary rounded-circle" style="width: 50px; height: 50px;">
                        <i class="fas fa-handshake text-white"></i>
                    </div>
                    <div class="ms-3">
                        <h5 class="text-primary mb-0">Ambiente colaborativo</h5>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 wow fadeInRight" data-wow-delay="0.5s">
                <div class="bg-light p-5 rounded shadow-lg">
                    <h3 class="fw-bold text-primary mb-4">Postúlate Ahora</h3>
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Nombre completo" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Correo electrónico" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-select" required>
                                <option value="" selected disabled>Selecciona un puesto</option>
                                <option value="nutricionista">Nutricionista</option>
                                <option value="entrenador">Entrenador personal</option>
                                <option value="marketing">Marketing digital</option>
                                <option value="atencion">Atención al cliente</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="4" placeholder="¿Por qué quieres unirte a nuestro equipo?" required></textarea>
                        </div>
                        <div class="mb-3">
                            <input type="file" class="form-control" accept=".pdf,.doc,.docx" required>
                            <small class="text-muted">Sube tu CV (PDF, DOC, DOCX)</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 animated pulse">
                            <i class="fas fa-paper-plane me-2"></i>Enviar Solicitud
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Fin de Trabaja con Nosotros -->
