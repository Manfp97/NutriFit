<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrifit - Tu salud, nuestra prioridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #FFA500;
        }
        .top-bar {
            background-color: #f8f9fa;
            padding: 5px 0;
            font-size: 0.9rem;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
        }
        .btn-outline-primary {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
<header th:fragment="header">
    <div class="top-bar d-none d-lg-block">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 text-start">
                    <small><i class="fas fa-map-marker-alt me-2"></i>Calle Larios, Málaga</small>
                    <small class="ms-4"><i class="fas fa-envelope me-2"></i>info@nutrifit.com</small>
                </div>
                <div class="col-lg-6 text-end">
                    <small>Síguenos:</small>
                    <a class="text-dark ms-3" href="#"><i class="fab fa-facebook-f"></i></a>
                    <a class="text-dark ms-3" href="#"><i class="fab fa-twitter"></i></a>
                    <a class="text-dark ms-3" href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a class="text-dark ms-3" href="#"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container">
            <a th:href="@{/}" class="navbar-brand">
                <h1 class="m-0 text-primary">Nutri<span class="text-secondary">fit</span></h1>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/dietaUsuario}">Nutrición</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/entrenamiento}">Entrenamiento</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/producto}">Tienda</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/carrito}">
                            <i class="bi bi-cart-fill"></i> Carrito
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/usuario/nuevo}">Regístrate</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center ms-lg-4" sec:authorize="isAuthenticated()">
                    <a class="btn btn-outline-primary me-3" th:href="@{/usuario/perfil}">
                        <i class="fas fa-user me-2"></i><span th:text="${#authentication.name}"></span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger">
                            <i class="fas fa-sign-out-alt me-2"></i>Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
