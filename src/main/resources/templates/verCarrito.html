<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nosotros</title>
</head>
<body>
<div>
    <div layout:fragment="content">
        <h1>Carrito de Compras</h1>
        <ul>
            <li th:each="producto : ${productos}">
                <span th:text="${producto.nombre}"></span> -
                <span th:text="${producto.precio}"></span> €
                <form th:action="@{/carrito/eliminar/{idProducto}(idProducto=${producto.id})}" method="post">
                    <button type="submit">Eliminar</button>
                </form>
            </li>
        </ul>
        <p>Total: <span th:text="${preciototal}"></span> €</p>
        <a href="/">Seguir Comprando</a>
    </div>
</div>
</body>
</html>
