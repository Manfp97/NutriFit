<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/js/sockjs-0.3.4.js}"></script>
    <script th:src="@{/js/stomp.js}"></script>
    <style>
        .chat-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .member-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .message {
            margin-bottom: 15px;
        }
        .message-content {
            display: inline-block;
            padding: 10px;
            border-radius: 15px;
            max-width: 80%;
        }
        .message-sent .message-content {
            background-color: #dcf8c6;
            float: right;
        }
        .message-received .message-content {
            background-color: #f1f0f0;
            float: left;
        }
        .message-info {
            font-size: 0.8em;
            color: #888;
            clear: both;
        }

        .new-message {
            font-weight: bold;
            color: #007bff;
        }

    </style>
</head>
<body onload="disconnect()">
<div class="container py-5">
    <div class="row">
        <!-- Member List Column -->
        <div class="col-md-4 mb-4">
            <h5 class="font-weight-bold mb-3 text-center text-lg-start">Members</h5>
            <div class="card member-list">
                <div class="card-body" id="memberList">
                    <!-- Member list will be populated here -->
                </div>
            </div>
            <div class="mt-3">
                <input type="text" id="from" class="form-control" placeholder="Your nickname" th:value="${#authentication.getName()}" readonly/>
                <button id="connect" onclick="connect();" class="btn btn-primary mt-2">Connect</button>
                <button id="disconnect" disabled="disabled" onclick="disconnect();" class="btn btn-secondary mt-2">Disconnect</button>
            </div>
        </div>

        <!-- Chat Area Column -->
        <div class="col-md-8">
            <ul class="nav nav-tabs" id="chatTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="private-tab" data-bs-toggle="tab" data-bs-target="#private" type="button" role="tab" aria-controls="private" aria-selected="false">Private Chat</button>
                </li>
                <!-- Private Chat Tabs will be dynamically added here -->
            </ul>
            <div class="tab-content" id="chatTabContent">
                <div class="tab-pane fade show active" id="public" role="tabpanel" aria-labelledby="public-tab">
                    <div class="card">
                        <div class="card-body chat-container" id="publicChatArea">
                            <!-- Public chat messages will appear here -->
                        </div>
                        <div class="card-footer">
                            <div class="input-group">
                                <input type="text" id="publicText" class="form-control" placeholder="Write a public message..."/>
                                <button class="btn btn-primary" onclick="sendMessage();">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="private" role="tabpanel" aria-labelledby="private-tab">
                    <div class="card">
                        <div class="card-body chat-container" id="privateChatArea">
                            <!-- Private chat messages will appear here -->
                        </div>
                        <div class="card-footer">
                            <div class="input-group mb-2">
                                <input type="text" id="to" class="form-control" placeholder="Recipient's nickname"/>
                            </div>
                            <div class="input-group">
                                <input type="text" id="privateText" class="form-control" placeholder="Write a private message..."/>
                                <button class="btn btn-primary" onclick="sendPrivateMessage();">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Dynamic Private Chat Content -->
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var stompClient = null;
    var notificationCount = 0;
    var privateChats = {}; // Object to track private chat tabs

    function setConnected(connected) {
        document.getElementById('connect').disabled = connected;
        document.getElementById('disconnect').disabled = !connected;
        document.getElementById('publicChatArea').style.visibility = connected ? 'visible' : 'hidden';
        document.getElementById('privateChatArea').style.visibility = connected ? 'visible' : 'hidden';
        document.getElementById('publicChatArea').innerHTML = '';
        document.getElementById('privateChatArea').innerHTML = '';
        // Hide private chat tabs when disconnected
        for (var key in privateChats) {
            document.getElementById('chatTabContent').removeChild(privateChats[key]);
            document.getElementById('chatTabs').removeChild(document.getElementById('tab-' + key));
        }
        privateChats = {};
    }

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            setConnected(true);
            console.log('Connected: ' + frame);
            stompClient.subscribe('/topic/messages', function(messageOutput) {
                showMessageOutput(JSON.parse(messageOutput.body), 'publicChatArea');
            });
            stompClient.subscribe('/user/topic/private-messages', function (messageOutput) {
                handlePrivateMessage(JSON.parse(messageOutput.body));
            });

            stompClient.subscribe('/topic/global-notifications', function (messageOutput) {
                notificationCount = notificationCount + 1;
            });

            stompClient.subscribe('/user/topic/private-notifications', function (message) {
                notificationCount = notificationCount + 1;
            });
            saveuserinfo();
        });
    }

    function saveuserinfo() {
        var from = document.getElementById('from').value;
        var url = 'http://localhost:8091/registerwebsocket/' + from
        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log(data);
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    function disconnect() {
        if(stompClient != null) {
            stompClient.disconnect();
        }
        setConnected(false);
        console.log("Disconnected");
    }

    function sendMessage() {
        var from = document.getElementById('from').value;
        var text = document.getElementById('publicText').value;
        stompClient.send("/app/chat", {}, JSON.stringify({'from':from, 'text':text}));
        document.getElementById('publicText').value = '';
    }

    function sendPrivateMessage() {
        var from = document.getElementById('from').value;
        var text = document.getElementById('privateText').value;
        var to = document.getElementById('to').value;
        stompClient.send("/app/private-message", {}, JSON.stringify({'from':from, 'to':to, 'text':text}));
        document.getElementById('privateText').value = '';
        if (!privateChats[to]) {
            createPrivateChatTab(to);
        }
        showMessageOutput({from, to, text, time: new Date().toLocaleTimeString()}, 'privateChatArea-' + to);
    }

    function handlePrivateMessage(messageOutput) {
        var from = messageOutput.from;
        var to = messageOutput.to;
        var currentUser = document.getElementById('from').value;

        // Determine if the current user is the recipient
        var isRecipient = to === currentUser;

        // Create or show chat tab for the other user
        var otherUser = isRecipient ? from : to;

        if (!privateChats[otherUser]) {
            createPrivateChatTab(otherUser);
        }

        showMessageOutput(messageOutput, 'privateChatArea-' + otherUser);

        // If this user is the recipient, show a notification or highlight the tab
        if (isRecipient) {
            notifyNewMessage(from);
        }
    }

    function notifyNewMessage(from) {
        // Find the tab for this sender
        var tab = document.getElementById('private-tab-' + from);
        if (tab) {
            // Highlight the tab or show a notification indicator
            tab.classList.add('new-message');
            tab.innerHTML += ' <span class="badge bg-danger">New</span>';
        }

        // You could also show a browser notification here
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification("New message from " + from);
        }
    }


    function createPrivateChatTab(to) {
        if (to !== document.getElementById('from').value) {
            // Create a new tab for the private chat
            var tab = document.createElement('li');
            tab.className = 'nav-item';
            tab.role = 'presentation';
            tab.id = 'tab-' + to;

            var tabButton = document.createElement('button');
            tabButton.className = 'nav-link';
            tabButton.id = 'private-tab-' + to;
            tabButton.setAttribute('data-bs-toggle', 'tab');
            tabButton.setAttribute('data-bs-target', '#private-' + to);
            tabButton.type = 'button';
            tabButton.role = 'tab';
            tabButton.ariaControls = 'private-' + to;
            tabButton.ariaSelected = 'false';
            tabButton.textContent = 'Chat with ' + to;

            tab.appendChild(tabButton);
            document.getElementById('chatTabs').appendChild(tab);

            // Create the tab content
            var tabPane = document.createElement('div');
            tabPane.className = 'tab-pane fade';
            tabPane.id = 'private-' + to;
            tabPane.role = 'tabpanel';
            tabPane.ariaLabelledby = 'private-tab-' + to;

            var card = document.createElement('div');
            card.className = 'card';

            var cardBody = document.createElement('div');
            cardBody.className = 'card-body chat-container';
            cardBody.id = 'privateChatArea-' + to;

            var cardFooter = document.createElement('div');
            cardFooter.className = 'card-footer';

            var inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';

            var inputField = document.createElement('input');
            inputField.type = 'text';
            inputField.className = 'form-control';
            inputField.placeholder = 'Write a private message...';

             sendButton.onclick = function() {
                var from = document.getElementById('from').value;
                var text = inputField.value;
                console.log('Enviando mensaje desde ' + from + ' a ' + to);
                stompClient.send("/app/private-message", {}, JSON.stringify({'from': from, 'to': to, 'text': text}));
                console.log('Mensaje enviado');
                inputField.value = '';
                showMessageOutput({from, text, time: new Date().toLocaleTimeString()}, 'privateChatArea-' + to);
            };

            inputGroup.appendChild(inputField);
            inputGroup.appendChild(sendButton);
            cardFooter.appendChild(inputGroup);
            card.appendChild(cardBody);
            card.appendChild(cardFooter);
            tabPane.appendChild(card);

            document.getElementById('chatTabContent').appendChild(tabPane);

            privateChats[to] = tabPane;

            // Activate the new tab
            var bootstrapTab = new bootstrap.Tab(document.getElementById('private-tab-' + to));
            bootstrapTab.show();
        }
    }

    function showMessageOutput(messageOutput, chatAreaId) {
        var chatArea = document.getElementById(chatAreaId);
        var messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + (messageOutput.from === document.getElementById('from').value ? 'message-sent' : 'message-received');

        var contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.textContent = messageOutput.text;

        var infoDiv = document.createElement('div');
        infoDiv.className = 'message-info';
        infoDiv.textContent = messageOutput.from + ' • ' + messageOutput.time;

        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(infoDiv);
        chatArea.appendChild(messageDiv);

        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Function to populate the member list (you'll need to implement the logic to get the member list)
    function updateMemberList(members) {
        var memberList = document.getElementById('memberList');
        memberList.innerHTML = '';
        members.forEach(function(member) {
            var memberDiv = document.createElement('div');
            memberDiv.className = 'mb-2';
            memberDiv.textContent = member;
            memberList.appendChild(memberDiv);
        });
    }

    // Call this function when you receive updates about connected members
    // updateMemberList(['User1', 'User2', 'User3']);11
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
