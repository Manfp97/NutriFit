<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriFit Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        #messageArea {
            height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row">
        <div class="col-md-4 col-lg-4 col-xl-3 mb-4 mb-md-0">
            <h5 class="font-weight-bold mb-3 text-center text-lg-start">Usuarios</h5>
            <div class="card">
                <div class="card-body">
                    <ul class="list-unstyled mb-0" id="usersList">
                        <!-- Usuarios conectados se agregarán aquí dinámicamente -->
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-8 col-lg-8 col-xl-9">
            <div class="card" id="chat-card">
                <div class="card-body" id="messageArea">
                    <!-- Mensajes se agregarán aquí dinámicamente -->
                </div>
                <div class="card-footer">
                    <div class="input-group">
                        <input type="text" id="message" class="form-control" placeholder="Escribe un mensaje...">
                        <button class="btn btn-primary" type="button" onclick="sendMessage()">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var stompClient = null;
    var username = null;

    function connect() {
        username = prompt('Por favor, ingresa tu nombre:', '');
        if (username) {
            var socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }
    }

    function onConnected() {
        stompClient.subscribe('/topic/public', onMessageReceived);
        stompClient.send("/app/chat.addUser",
            {},
            JSON.stringify({sender: username, type: 'JOIN'})
        )
        document.querySelector('#message').focus();
    }

    function onError(error) {
        console.log('No se pudo conectar al servidor WebSocket. Por favor, recarga esta página para intentar de nuevo.');
    }

    function sendMessage() {
        var messageContent = document.querySelector('#message').value.trim();
        if (messageContent && stompClient) {
            var chatMessage = {
                sender: username,
                content: messageContent,
                type: 'CHAT'
            };
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));

            // Agregar el mensaje enviado inmediatamente a la vista
            addMessageToChat(chatMessage, true);

            document.querySelector('#message').value = '';
        }
    }

    function onMessageReceived(payload) {
        var message = JSON.parse(payload.body);
        if (message.type === 'JOIN') {
            addUserToList(message.sender);
            addEventMessageToChat(message.sender + ' se ha unido al chat!');
        } else if (message.type === 'LEAVE') {
            removeUserFromList(message.sender);
            addEventMessageToChat(message.sender + ' ha abandonado el chat.');
        } else if (message.type === 'CHAT' && message.sender !== username) {
            addMessageToChat(message, false);
        }
    }

    function addMessageToChat(message, isSentByMe) {
        var messageElement = document.createElement('div');
        messageElement.classList.add('d-flex', 'mb-4', isSentByMe ? 'justify-content-end' : 'justify-content-start');

        var messageContent = document.createElement('div');
        messageContent.classList.add('card', isSentByMe ? 'bg-primary' : 'bg-light');
        messageContent.style.maxWidth = '80%';

        var cardBody = document.createElement('div');
        cardBody.classList.add('card-body');
        cardBody.style.padding = '0.5rem 1rem';

        var textElement = document.createElement('p');
        textElement.classList.add('mb-0');
        textElement.style.color = isSentByMe ? 'white' : 'black';
        textElement.textContent = message.content;

        var senderElement = document.createElement('small');
        senderElement.classList.add('d-block', 'text-muted');
        senderElement.textContent = isSentByMe ? 'Tú' : message.sender;

        cardBody.appendChild(senderElement);
        cardBody.appendChild(textElement);
        messageContent.appendChild(cardBody);
        messageElement.appendChild(messageContent);

        var messageArea = document.querySelector('#messageArea');
        messageArea.appendChild(messageElement);
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    function addEventMessageToChat(text) {
        var messageElement = document.createElement('div');
        messageElement.classList.add('text-center', 'my-2');
        messageElement.innerHTML = '<small class="text-muted">' + text + '</small>';

        var messageArea = document.querySelector('#messageArea');
        messageArea.appendChild(messageElement);
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    function addUserToList(userName) {
        var usersList = document.querySelector('#usersList');
        var userItem = document.createElement('li');
        userItem.classList.add('p-2', 'border-bottom');
        userItem.innerHTML = '<a href="#!" class="d-flex justify-content-between"><div class="d-flex flex-row"><img src="https://mdbcdn.b-cdn.net/img/Photos/Avatars/avatar-8.webp" alt="avatar" class="rounded-circle d-flex align-self-center me-3 shadow-1-strong" width="60"><div class="pt-1"><p class="fw-bold mb-0">' + userName + '</p></div></div></a>';
        usersList.appendChild(userItem);
    }

    function removeUserFromList(userName) {
        var usersList = document.querySelector('#usersList');
        var users = usersList.getElementsByTagName('li');
        for (var i = 0; i < users.length; i++) {
            if (users[i].textContent.includes(userName)) {
                usersList.removeChild(users[i]);
                break;
            }
        }
    }

    document.querySelector('#message').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
            e.preventDefault();
        }
    });

    window.addEventListener('load', connect, true);
</script>
</body>
</html>
