<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <!-- Incluye los estilos de Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Incluye Font Awesome para iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
        }
        .card-header {
            background-color: #4caf50;
            color: #fff;
        }
        .card-body {
            background-color: #fff;
        }
        .card-body p {
            margin-bottom: 0;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-secondary {
            background-color: #28a745;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #218838;
        }
        .list-group-item {
            border: none;
        }
        .list-group-item strong {
            font-size: 1.25rem;
        }
        .btn-spacing {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="mt-5 mb-4 text-center">Carrito de Compras</h1>
    <div class="row d-flex justify-content-center my-4">
        <div class="col-md-8">
            <div th:if="${carrito.size() > 0}">
                <div class="card mb-4">
                    <div class="card-header py-3">
                        <h5 class="mb-0">Carrito - <span th:text="${carrito.size()}"></span> productos</h5>
                    </div>
                    <div class="card-body">
                        <div th:each="productoCarrito : ${carrito}" class="row mb-4">
                            <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                                <div class="bg-light hover-overlay hover-zoom ripple rounded">
                                    <img th:src="@{/img/Creatina-Creapure-Justloading-2.jpg}" class="w-100 rounded" alt="Producto"/>
                                </div>
                            </div>
                            <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                                <p><strong th:text="${productoCarrito.producto.nombre}">Nombre del Producto</strong></p>
                                <p><span th:id="@{'pvp_' + ${productoCarrito.producto.getId()}}"
                                         th:attr="data-pvp=${productoCarrito.producto.getPrecio()}"
                                         th:text="'Precio: $' + ${productoCarrito.producto.getPrecio()}"></span></p>
                                <form th:action="@{'/carrito/eliminar/' + ${productoCarrito.producto.getId()}}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                            <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                                <div class="input-group mb-3">
                                    <button class="btn btn-outline-secondary" type="button" onclick="updateQuantity(this, -1)" th:attr="data-idprod=${productoCarrito.producto.getId()}, data-precio=${productoCarrito.producto.getPrecio()}">-</button>
                                    <input th:id="@{'cant_' + ${productoCarrito.producto.id}}" type="text" class="form-control" placeholder="" th:value="${productoCarrito.cantidad}" onchange="updateQuantity(this, 0)">
                                    <button class="btn btn-outline-secondary" type="button" onclick="updateQuantity(this, 1)" th:attr="data-idprod=${productoCarrito.producto.getId()}, data-precio=${productoCarrito.producto.getPrecio()}">+</button>
                                </div>
                                <p class="text-start text-md-center mt-2">
                                    <strong th:id="@{'tot_' + ${productoCarrito.producto.id}}" th:text="'Total: $' + ${productoCarrito.producto.getPrecio() * productoCarrito.cantidad}"> </strong>
                                </p>
                            </div>
                        </div>
                        <hr class="my-4"/>
                    </div>
                </div>
            </div>
            <div th:if="${carrito.size() == 0}">
                <p class="text-center">El carrito está vacío.</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header py-3">
                    <h5 class="mb-0">Resumen</h5>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 pb-0">
                            Productos
                            <span id="subtotal">$0.00</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            Envío
                            <span>Gratis</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 mb-3">
                            <div>
                                <strong>Total</strong>
                                <strong>
                                    <p class="mb-0">(incluye IVA)</p>
                                </strong>
                            </div>
                            <span><strong id="cartTotal">$0.00</strong></span>
                        </li>
                    </ul>
                    <button type="button" class="btn btn-success btn-lg btn-block">Proceder al pago</button>
                    <div class="btn-spacing">
                        <a class="btn btn-secondary btn-lg" th:href="@{/producto}">
                            <i class="fas fa-arrow-left me-2"></i>Volver a la tienda
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Incluye los scripts de Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- JS LOCAL -->
<script type="application/javascript">
    function updateQuantity(element, change) {
        const prod = element.dataset.idprod || element.id.split('_')[1];
        const precio = parseFloat(document.getElementById('pvp_' + prod).dataset.pvp);
        const inp = document.getElementById("cant_" + prod);
        const totSpan = document.getElementById("tot_" + prod);

        let newValue = parseInt(inp.value) + change;
        if (newValue < 1) newValue = 1;

        inp.value = newValue;
        const total = (precio * newValue).toFixed(2);
        totSpan.textContent = 'Total: $' + total;

        updateCartTotal();
    }

    function updateCartTotal() {
        const totalElements = document.querySelectorAll('[id^="tot_"]');
        let cartTotal = 0;

        totalElements.forEach(el => {
            cartTotal += parseFloat(el.textContent.split('$')[1]);
        });

        document.getElementById('subtotal').textContent = '$' + cartTotal.toFixed(2);
        document.getElementById('cartTotal').textContent = '$' + cartTotal.toFixed(2);
    }

    // Initialize totals on page load
    document.addEventListener('DOMContentLoaded', () => {
        updateCartTotal();
    });
</script>
</body>
</html>
