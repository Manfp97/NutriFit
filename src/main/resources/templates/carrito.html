<!DOCTYPE html>
<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <!-- Incluye los estilos de Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div layout:fragment="content">
    <section class="h-100">
        <div class="container py-5">
            <h1 class="mt-5 text-center text-white">Carrito de Compras</h1>
            <div class="row d-flex justify-content-center my-4">
                <div class="col-md-8">
                    <div th:if="${carrito.size() > 0}">
                        <div class="card mb-4">
                            <div class="card-header py-3" style="background-color: #4caf50; color: #fff;">
                                <h5 class="mb-0">Carrito - <span th:text="${carrito.size()}"></span> productos</h5>
                            </div>
                            <div class="card-body">
                                <!-- Recorre los productos en el carrito -->
                                <div th:each="producto : ${carrito}" class="row mb-4">
                                    <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                                        <!-- Imagen del producto -->
                                        <div class="bg-light hover-overlay hover-zoom ripple rounded" data-mdb-ripple-color="light">
                                            <img th:src="@{/img/PROTE}" class="w-100" alt="Producto"/>
                                            <a href="#">
                                                <div class="mask" style="background-color: rgba(251, 251, 251, 0.2)"></div>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                                        <!-- Datos del producto -->
                                        <p><strong th:text="${producto.nombre}">Nombre del Producto</strong></p>
                                        <p><span th:text="'Precio: $' + ${producto.precio}"></span></p>
                                        <form th:action="@{'/carrito/eliminar/' + ${producto.id}}" method="post">
                                            <button type="submit" class="btn btn-danger btn-sm me-1 mb-2" data-mdb-tooltip-init title="Eliminar del carrito">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                    <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                                        <!-- Cantidad -->
                                        <form th:action="@{'/carrito/agregar/' + ${producto.id}}" method="post">
                                            <div class="d-flex mb-4" style="max-width: 300px">
                                                <button type="button" class="btn btn-success px-3 me-2" onclick="this.parentNode.querySelector('input[type=number]').stepDown()">
                                                    <i class="fas fa-minus"></i>
                                                </button>
                                                <div class="form-outline">
                                                    <input id="cantidad" name="cantidad" min="1" type="number" class="form-control" placeholder="1"/>
                                                    <label class="form-label" for="cantidad">Cantidad</label>
                                                </div>
                                                <button type="button" class="btn btn-success px-3 ms-2" onclick="this.parentNode.querySelector('input[type=number]').stepUp()">
                                                    <i class="fas fa-plus"></i>
                                                </button>
                                                <button type="submit" class="btn btn-primary ms-2">Actualizar</button>
                                            </div>
                                        </form>
                                        <!-- Precio total por producto -->
                                        <p class="text-start text-md-center">
                                            <strong th:text="'Total: $' + ${producto.precio}"></strong>
                                        </p>
                                    </div>
                                </div>
                                <hr class="my-4"/>
                            </div>
                        </div>
                    </div>
                    <!-- Mensaje si el carrito está vacío -->
                    <div th:if="${carrito.size() == 0}">
                        <p>El carrito está vacío.</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <!-- Resumen del carrito -->
                    <div class="card mb-4">
                        <div class="card-header py-3" style="background-color: #4caf50; color: #fff;">
                            <h5 class="mb-0">Resumen</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 pb-0">
                                    Productos
                                    <span th:text="'$' + ${carritoTotal}"></span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                    Envío
                                    <span>Gratis</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 mb-3">
                                    <div>
                                        <strong>Total</strong>
                                        <strong>
                                            <p class="mb-0">(incluye IVA)</p>
                                        </strong>
                                    </div>
                                    <span><strong th:text="'$' + ${carritoTotal}"></strong></span>
                                </li>
                            </ul>
                            <button type="button" class="btn btn-success btn-lg btn-block">Proceder al pago</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Incluye los scripts de Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
